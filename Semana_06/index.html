<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>User Registration</h1>

        <form id="registroForm" novalidate>
            <!--Nombre-->
            <div class="field">
                <label for="nombre" >Name *</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" autocomplete="name">
                <small class="error" id="nombreError"></small>
            
            </div>

            <!--Correo Electrónico-->
            <div class="field">
                <label for="email" >E-mail *</label>
                <input type="email" id="email" name="email" placeholder="Ej: juan@example.com" autocomplete="email">
                <small class="error" id="emailError"></small>

            </div>

            <!--Contraseña-->
            <div class="field">
                <label for="password" >Password *</label>
                <input type="password" id="password" name="password" placeholder="Minimum 8 characters, one uppercase letter, one lowercase letter and one number" autocomplete="new-password">
                <small class="error" id="passwordError"></small>

            </div>

            <!--Confirmar Contraseña-->
            <div class="field">
                <label for="confirmPassword" >Confirm Password *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat the password" autocomplete="new-password">
                <small class="error" id="confirmPasswordError"></small>
            </div>

            <!--Edad-->
            <div class="field">
                <label for="edad" >Age *</label>
                <input type="number" id="edad" name="edad" placeholder="Ej: 18" min="0" />
                <small class="error" id="edadError"></small>
            </div>

            <!--Botones-->
            <div class="actions">
                <button type="submit" id="btnEnviar" disabled>Register</button>
                <button type="reset" id="btnReset" class="secondary">Clear</button>
            </div>

            <!--Mensaje de éxito-->
            <div id="mensajeExito" class="success-message" style="display: none;"></div>

        </form>
    </main>


    <script src="script.js"></script>
</body>
</html>
