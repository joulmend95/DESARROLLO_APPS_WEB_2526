<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 05</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h3>Galeria de imagenes.</h3>
        <p>Agregar imagen desde URL</p>

    </header>

    <main class="contenedor">
        <section>
            <label for="urlimagen"> URL de imagen: </label>
            <input type="url" id="urlimagen" placeholder="https://example.com/imagen.jpg">
        </section>

        <div class="botones">
            <button id=btnAgregar>Agregar Imagen</button>
        </div>

        <section>
            <h2>Galeria de imagenes</h2>
            <div id="galeria" class="galeria"></div>

        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
