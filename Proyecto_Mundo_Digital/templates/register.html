{% extends "base.html" %}
{% block title %}Registro - Mundo Digital{% endblock %}
{% block content %}
    <h1>Crear una Cuenta</h1>
    <form action="" method="POST" style="max-width: 300px;">
        <div style="margin-bottom: 10px;">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required style="width: 100%;">
        </div>
        <div style="margin-bottom: 10px;">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required style="width: 100%;">
        </div>
        <div style="margin-bottom: 10px;">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required style="width: 100%;">
        </div>
        <button type="submit">Registrar</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="{{ url_for('login', next=request.args.get('next', '')) }}">Inicia sesión aquí</a>.</p>
{% endblock %}
