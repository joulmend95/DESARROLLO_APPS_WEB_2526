{% extends "base.html" %}
{% block title %}Iniciar Sesión - Mundo Digital{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center py-3">
                <h3 class="mb-0">Iniciar Sesión</h3>
            </div>
            <div class="card-body p-4">
                <form action="" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Correo electrónico o usuario:</label>
                        <input type="text" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Contraseña:</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                    </div>
                </form>
                <hr class="mt-4">
                <p class="text-center mb-0">¿No tienes cuenta? <a href="{{ url_for('register', next=request.args.get('next', '')) }}" class="text-decoration-none fw-bold">Regístrate aquí</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
